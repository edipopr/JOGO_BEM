<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;height:100%;overflow:hidden;background:#000}
iframe{border:0;width:100%;height:100%}
#log{position:fixed;left:0;bottom:0;right:0;background:rgba(0,0,0,.75);color:#7f7;font:13px monospace;white-space:pre-wrap;max-height:35%;overflow:hidden}
</style></head><body>
<iframe id="f" src="../index.html"></iframe>
<div id="log"></div>
<script>
// Página de teste (abrir via servidor local). Ex.: ferramentas/teste.html?heroi=funBot&roteiro=W:2,J,W:1
// fase=noite → escolhe a fase (libera todas)
// roteiro: lista de ações; "W:2" = segura W por 2 s; "J" = aperta J; "espera:1" = espera 1 s.
const q = new URLSearchParams(location.search);
const f = document.getElementById('f');
const linhas = [];
const log = (m) => { linhas.push(m); document.getElementById('log').textContent = linhas.slice(-8).join('\n'); };
f.addEventListener('load', () => {
  const w = f.contentWindow, d = f.contentDocument;
  w.addEventListener('error', (e) => log('ERRO: ' + e.message));
  w.confirm = () => true; // os testes aceitam as perguntas (ex.: substituir jogo salvo)
  const tecla = (tipo, code) => w.dispatchEvent(new w.KeyboardEvent(tipo, { code, bubbles: true }));
  const g = () => w.guizinhoDebug;
  // Avança o jogo manualmente (o headless quase não gera quadros de animação)
  const simular = (segundos) => { for (let t = 0; t < segundos; t += 1 / 30) g().passo(1 / 30); };
  const estado = (rotulo) => {
    const j = g().jogador, p = j.posicao;
    log(`${rotulo}: ${g().estado} pos=(${p.x.toFixed(1)},${p.y.toFixed(1)},${p.z.toFixed(1)}) vida=${j.vida} inf=${Math.round(j.infeccao)} derrotados=${g().inimigos.derrotados}` + (g().chefao ? ` chefao=${g().chefao.estado}/${g().chefao.vida}` : ``));
  };
  setTimeout(() => {
    if (q.get('fase')) { // libera as fases para o teste
      w.localStorage.setItem('guizinho.recordes', JSON.stringify(Object.fromEntries(['floresta', 'noite', 'mar', 'laboratorio', 'pesadelo', 'castelo'].map((id) => [id, { concluida: true, melhorPontos: 0, melhorTempo: 999, maxEstrelas: 0, todosCristais: false }]))));
    }
    d.getElementById('btn-jogar').click();
    if (q.get('heroi')) d.querySelector(`.cartao[data-id="${q.get('heroi')}"]`).click();
    if (q.get('fase')) d.querySelector(`#escolha-fase button[data-id="${q.get('fase')}"]`).click();
    if (!q.get('roteiro')) return;
    d.getElementById('btn-comecar').click();
    if (q.get('teleporte')) {
      const [x, y, z] = q.get('teleporte').split(',').map(Number);
      g().jogador.posicao.set(x, y, z);
    }
    if (q.get('giro')) w.guizinhoDebug.camera.angulo = Number(q.get('giro')); // gira a câmera (rad)
    if (q.get('inclina')) w.guizinhoDebug.camera.inclinacao = Number(q.get('inclina'));
    if (q.get('distancia')) w.guizinhoDebug.camera.distancia = Number(q.get('distancia'));
    for (const acao of q.get('roteiro').split(',')) {
      const [nome, seg] = acao.split(':');
      if (nome === 'vida') g().jogador.vida = g().jogador.vidaMax = Number(seg); // vida:99
      else if (nome === 'vencer') { g().chefao.receberDano ? (g().chefao.vida = 1, g().chefao.receberDano()) : 0; simular(4); g().jogador.posicao.copy(g().portal.posicao); simular(0.2); } // derrota o chefão e entra no portal
      else if (nome === 'menu') d.getElementById('btn-menu-vitoria').click();
      else if (nome === 'pacifico') g().inimigos.lista.forEach((i) => { if (!i.bloquear) { i.derrotar(); i.tempoRenascer = 1e9; } }); // some com os inimigos
      else if (nome === 'luta') { // luta:60 = ataca o chefão quando ele cansa (até 60 s) e registra os estados por que passou
        const vistos = {}; let ant = '';
        for (let s = 0; s < Number(seg) && g().chefao.ativo; s += 1 / 30) {
          const c = g().chefao, j = g().jogador;
          if (c.estado !== ant) { ant = c.estado; vistos[ant] = (vistos[ant] || 0) + 1; }
          if (c.estado === 'vulneravel') {
            const dx = j.posicao.x - c.posicao.x, dz = j.posicao.z - c.posicao.z, r = Math.hypot(dx, dz) || 1;
            j.posicao.set(c.posicao.x + dx / r * (c.raio + 1), c.posicao.y, c.posicao.z + dz / r * (c.raio + 1));
            j.angulo = Math.atan2(-dx, -dz);
            j.velocidade.set(0, 0, 0);
            tecla('keydown', 'KeyJ'); tecla('keyup', 'KeyJ');
          }
          g().passo(1 / 30);
        }
        log('estados: ' + JSON.stringify(vistos));
      }
      else if (nome === 'espera') simular(Number(seg));
      else if (nome[0] === '+') tecla('keydown', 'Key' + nome.slice(1)); // segura
      else if (nome[0] === '-') tecla('keyup', 'Key' + nome.slice(1));   // solta
      else if (seg) { tecla('keydown', 'Key' + nome); simular(Number(seg)); tecla('keyup', 'Key' + nome); }
      else if (nome === 'Espaco') { tecla('keydown', 'Space'); simular(0.05); tecla('keyup', 'Space'); }
      else { tecla('keydown', 'Key' + nome); simular(0.05); tecla('keyup', 'Key' + nome); }
      estado(acao);
    }
    g().passo(1 / 30, true);
    log(`desenhos: ${g().renderizador.info.render.calls} triangulos: ${g().renderizador.info.render.triangles}`);
    {
    }
  }, 800);
});
</script></body></html>
